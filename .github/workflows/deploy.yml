name: Deploy to cPanel

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Create build env (.env not in git)
        run: |
          echo "NEXT_PUBLIC_SITE_URL=https://javaorigins.co.nz" > .env
          echo "NEXT_PUBLIC_ADMIN_WA=${{ vars.NEXT_PUBLIC_ADMIN_WA }}" >> .env
          echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}" >> .env
          cat .env

      - name: Build
        run: npm run build

      - name: Package .next
        run: |
          cd .next
          zip -r ../next-deploy.zip server static types BUILD_ID \
            build-manifest.json app-build-manifest.json \
            required-server-files.json routes-manifest.json
        working-directory: .

      - name: Upload zip via FTP
        run: |
          curl --ftp-create-dirs \
            -u "${{ secrets.SSH_USER }}:${{ secrets.SSH_PASS }}" \
            -T next-deploy.zip \
            "ftp://103.30.147.53${{ secrets.SSH_APP_PATH }}/next-deploy.zip"

      - name: Extract & restart via cPanel API
        run: |
          BASE="https://wirogunan.idweb.host:2083"
          AUTH="${{ secrets.SSH_USER }}:${{ secrets.SSH_PASS }}"
          APP="${{ secrets.SSH_APP_PATH }}"

          # Extract zip into .next/
          curl -sk -u "$AUTH" \
            "$BASE/execute/Fileman/extract_file" \
            -d "dir=$APP&files=next-deploy.zip&dest=$APP/.next" | jq .

          # chmod via API
          curl -sk -u "$AUTH" \
            "$BASE/execute/Fileman/set_permissions" \
            -d "path=$APP/.next&permissions=755&recursive=1" | jq .

          # Delete zip
          curl -sk -u "$AUTH" \
            "$BASE/execute/Fileman/delete_files" \
            -d "files-0=$APP/next-deploy.zip" | jq .

          # Restart Node.js app (stop then start)
          curl -sk -u "$AUTH" \
            "$BASE/execute/PassengerApps/stop_app" \
            -d "app=$APP" | jq .
          sleep 3
          curl -sk -u "$AUTH" \
            "$BASE/execute/PassengerApps/start_app" \
            -d "app=$APP" | jq .
