name: Deploy to cPanel

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Create build env
        run: |
          echo "NEXT_PUBLIC_SITE_URL=https://javaorigins.co.nz" > .env
          echo "SITE_URL=https://javaorigins.co.nz" >> .env
          echo "NEXT_PUBLIC_ADMIN_WA=${{ vars.NEXT_PUBLIC_ADMIN_WA }}" >> .env

      - name: Build
        run: npm run build

      - name: Upload .next files + static via cPanel API
        env:
          CPANEL_HOST: wirogunan.idweb.host
          CPANEL_USER: ${{ secrets.SSH_USER }}
          CPANEL_PASS: ${{ secrets.SSH_PASS }}
          APP_PATH: ${{ secrets.SSH_APP_PATH }}
          STATIC_PATH: ${{ secrets.SSH_APP_PATH }}/.next/static
        run: node .github/scripts/upload-next.js

      - name: Restart Passenger
        env:
          CPANEL_HOST: wirogunan.idweb.host
          CPANEL_USER: ${{ secrets.SSH_USER }}
          CPANEL_PASS: ${{ secrets.SSH_PASS }}
          APP_PATH: ${{ secrets.SSH_APP_PATH }}
          STATIC_PATH: ${{ secrets.SSH_APP_PATH }}/.next/static
        run: node .github/scripts/upload-next.js --restart-only
